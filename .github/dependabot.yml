version: 2
updates:
  # The pnpm workspace: Dependabot reads pnpm-lock.yaml at the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The image runs Node 24 (Dockerfile NODE_VERSION), so the types stay on 24.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
