# One container runs the web app and the worker, with SQLite stored in the `seotools-data` volume.
#
#   cp .env.example .env     # then set BETTER_AUTH_SECRET and BETTER_AUTH_URL
#   docker compose up -d
#
# To build the image from source instead of pulling it, run: docker compose up -d --build
#
# The image defaults to :latest, the newest stable release. To choose the version, set
# SEOTOOLS_IMAGE in .env: ghcr.io/vhxa/seotools:0.2.1 (exactly that release) or :0.2 (its
# patches). Update with: docker compose pull && docker compose up -d. Take a backup first:
# docs/updating.md.
services:
  seotools:
    image: ${SEOTOOLS_IMAGE:-ghcr.io/vhxa/seotools:latest}
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file: .env
    environment:
      # The container always listens on 3000; PORT above only picks the host port.
      PORT: 3000
      # Compose database setting: set DATABASE_URL_DOCKER in .env for an external database.
      # DATABASE_URL in .env is for local development and is deliberately overridden.
      DATABASE_URL: ${DATABASE_URL_DOCKER:-file:/data/seotools.db}
    volumes:
      - seotools-data:/data
    # Gives the worker time to finish running jobs on `docker compose stop`.
    stop_grace_period: 40s
    networks: [default, render]

  browser:
    image: chromedp/headless-shell:158.0.8127.18
    profiles: [rendering]
    # Upstream run.sh expands $@ unquoted, splitting/globbing the resolver rule.
    # Preserve its forwarder and Chrome flags, but pass each extra argument intact.
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -ex
        exec socat TCP4-LISTEN:9222,fork TCP4:127.0.0.1:9223 &
        exec /headless-shell/headless-shell \
          --no-sandbox \
          --use-gl=angle \
          --use-angle=swiftshader \
          --remote-debugging-address=0.0.0.0 \
          --remote-debugging-port=9223 \
          "$$@"
      - --
    command:
      - --proxy-server=http://127.0.0.1:9
      - --proxy-bypass-list=<-loopback>
      - --host-resolver-rules=MAP * ~NOTFOUND
      - --force-webrtc-ip-handling-policy=disable_non_proxied_udp
    restart: unless-stopped
    user: '65534:65534'
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 256m
    mem_limit: 512m
    pids_limit: 128
    networks: [render]

volumes:
  seotools-data:

networks:
  default: {}
  render:
    internal: true
