# One container runs the web app and the worker, with SQLite stored in the `seotools-data` volume.
#
#   cp .env.example .env     # then set BETTER_AUTH_SECRET and BETTER_AUTH_URL
#   docker compose up -d
#
# To build the image from source instead of pulling it, run: docker compose up -d --build
#
# The image defaults to :latest, the newest stable release. To choose the version, set
# SEOTOOLS_IMAGE in .env: ghcr.io/botaroikawa/seotools:0.2.1 (exactly that release) or :0.2 (its
# patches). Update with: docker compose pull && docker compose up -d. Take a backup first:
# docs/updating.md.
services:
  seotools:
    image: ${SEOTOOLS_IMAGE:-ghcr.io/botaroikawa/seotools:latest}
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file: .env
    environment:
      # The container always listens on 3000; PORT above only picks the host port.
      PORT: 3000
      # Compose database setting: set DATABASE_URL_DOCKER in .env for an external database.
      # DATABASE_URL in .env is for local development and is deliberately overridden.
      DATABASE_URL: ${DATABASE_URL_DOCKER:-file:/data/seotools.db}
    volumes:
      - seotools-data:/data
    # Gives the worker time to finish running jobs on `docker compose stop`.
    stop_grace_period: 40s

volumes:
  seotools-data:
